name: Bootstrap JacRift source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand committed source archive
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .bootstrap/jacrift.zip ]; then
            echo "Bootstrap archive already expanded."
            exit 0
          fi
          unzip -o .bootstrap/jacrift.zip -d .
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: import JacRift source tree"
          git push
